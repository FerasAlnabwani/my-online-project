<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Achtergrond gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="600" fill="url(#bgGradient)"/>
  
  <!-- HTML Tag -->
  <g transform="translate(100, 150)">
    <rect width="150" height="150" fill="#FF6B6B" rx="10" opacity="0.9"/>
    <text x="75" y="90" font-size="60" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">&lt;/&gt;</text>
    <text x="75" y="130" font-size="18" fill="white" text-anchor="middle" font-weight="bold">HTML</text>
  </g>
  
  <!-- CSS Tag -->
  <g transform="translate(325, 150)">
    <rect width="150" height="150" fill="#4ECDC4" rx="10" opacity="0.9"/>
    <text x="75" y="85" font-size="50" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">{ }</text>
    <text x="75" y="130" font-size="18" fill="white" text-anchor="middle" font-weight="bold">CSS</text>
  </g>
  
  <!-- JavaScript Tag -->
  <g transform="translate(550, 150)">
    <rect width="150" height="150" fill="#F7DC6F" rx="10" opacity="0.9"/>
    <text x="75" y="85" font-size="50" font-weight="bold" fill="#333" text-anchor="middle" dominant-baseline="middle">f()</text>
    <text x="75" y="130" font-size="18" fill="#333" text-anchor="middle" font-weight="bold">JavaScript</text>
  </g>
  
  <!-- Beschrijvende tekst -->
  <text x="400" y="380" font-size="32" fill="white" text-anchor="middle" font-weight="bold">Web Development Fundamentals</text>
  
  <!-- Kleine beschrijving -->
  <text x="400" y="430" font-size="18" fill="white" text-anchor="middle" opacity="0.9">Bouw prachtige en semantische websites met HTML, CSS en JavaScript</text>
  
  <!-- Decoratieve elementen -->
  <circle cx="150" cy="520" r="30" fill="#FF6B6B" opacity="0.3"/>
  <circle cx="650" cy="550" r="40" fill="#4ECDC4" opacity="0.3"/>
  <circle cx="100" cy="580" r="25" fill="#F7DC6F" opacity="0.3"/>
</svg>
